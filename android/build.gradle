allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    // Force modern versions to resolve conflicts and fix lStar resource error
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
            force 'androidx.annotation:annotation:1.8.0'
            force 'androidx.browser:browser:1.8.0'
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                // Force modern SDK and namespace fallback for AGP 8 stability
                compileSdk = 36
                buildToolsVersion = "36.0.0-rc1"
                if (namespace == null) {
                    namespace project.group
                }

                // Synchronize JVM target to 17 across all plugins to prevent "Inconsistent JVM-target" errors
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                
                // If it's a Kotlin project, also force jvmTarget 17
                if (project.plugins.hasPlugin('kotlin-android')) {
                    kotlinOptions {
                        jvmTarget = '17'
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
