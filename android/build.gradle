allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    // Force modern androidx version across all sub-plugins to fix lStar resource error
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
            force 'androidx.annotation:annotation:1.8.0'
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    def configureAndroid = { p ->
        if (p.hasProperty('android')) {
            p.android {
                // Force modern SDK and namespace fallback for AGP 8 stability
                compileSdk = 36
                buildToolsVersion = "36.0.0-rc1"
                if (namespace == null) {
                    namespace p.group
                }
            }
        }
    }

    if (project.state.executed) {
        configureAndroid(project)
    } else {
        project.afterEvaluate { configureAndroid(project) }
    }

    // Force JVM target 1.8 for consistency across all plugins
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "1.8"
        }
    }
    
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = "1.8"
        targetCompatibility = "1.8"
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
